<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box { fill: #f4f6f8; stroke: #9aa5b1; stroke-width: 1.5; }
      .hot { fill: #fde8e8; stroke: #d64545; }
      .trig { fill: #fff4e0; stroke: #e0962d; }
      .t { font-size: 15px; fill: #1f2933; text-anchor: middle; }
      .stage { font-size: 16px; font-weight: 700; fill: #1f2933; }
      .note { font-size: 13px; fill: #52606d; font-style: italic; text-anchor: middle; }
      .a { stroke: #555; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>

  <!-- 1 Build-up -->
  <text class="stage" x="40" y="50">1. Build-up: a loop that pushes the price up</text>
  <rect rx="10" class="box" x="40" y="80" width="190" height="60"/>
  <text class="t" x="135" y="106">Investors chase</text><text class="t" x="135" y="126">past gains</text>
  <rect rx="10" class="box" x="280" y="80" width="190" height="60"/>
  <text class="t" x="375" y="106">Fund buys a small,</text><text class="t" x="375" y="126">hard-to-sell stock</text>
  <rect rx="10" class="box" x="520" y="80" width="190" height="60"/>
  <text class="t" x="615" y="116">Its price rises</text>
  <rect rx="10" class="box" x="760" y="80" width="190" height="60"/>
  <text class="t" x="855" y="106">The fund looks</text><text class="t" x="855" y="126">profitable</text>
  <path class="a" d="M230,110 H278"/>
  <path class="a" d="M470,110 H518"/>
  <path class="a" d="M710,110 H758"/>
  <path class="a" d="M855,80 V66 Q855,60 849,60 H141 Q135,60 135,66 V78"/>
  <rect x="420" y="51" width="160" height="18" fill="#ffffff"/>
  <text class="note" x="500" y="64">more money flows in</text>

  <!-- 2 Trigger -->
  <text class="stage" x="40" y="195">2. Trigger</text>
  <rect rx="10" class="box trig" x="230" y="210" width="540" height="56"/>
  <text class="t" x="500" y="234">A new rule caps the fund's position,</text>
  <text class="t" x="500" y="254">and investors ask for their money back</text>
  <path class="a" d="M500,140 V208"/>

  <!-- 3 Fire sale -->
  <text class="stage" x="40" y="300">3. Fire sale: the damage spreads</text>
  <rect rx="10" class="box" x="40" y="340" width="190" height="60"/>
  <text class="t" x="135" y="366">The fund must</text><text class="t" x="135" y="386">raise cash fast</text>
  <rect rx="10" class="box hot" x="280" y="340" width="190" height="60"/>
  <text class="t" x="375" y="366">The small stock crashes</text><text class="t" x="375" y="386">and trading stops</text>
  <rect rx="10" class="box" x="520" y="340" width="190" height="60"/>
  <text class="t" x="615" y="366">So the fund sells</text><text class="t" x="615" y="386">healthy big stocks</text>
  <rect rx="10" class="box hot" x="760" y="340" width="190" height="60"/>
  <text class="t" x="855" y="366">The whole market falls:</text><text class="t" x="855" y="386">market-wide halt</text>
  <path class="a" d="M500,266 V318 H135 V338"/>
  <path class="a" d="M230,370 H278"/>
  <path class="a" d="M470,370 H518"/>
  <path class="a" d="M710,370 H758"/>
  <path class="a" d="M855,400 V434 Q855,440 849,440 H141 Q135,440 135,434 V402"/>
  <text class="note" x="500" y="462">losses make more investors ask for their money back</text>
</svg>
