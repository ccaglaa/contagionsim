[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contagionsim"
version = "0.1.0"
description = "Agent-based limit order book simulator of fund fire sales and cross-asset contagion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
dev = [
    "matplotlib>=3.8",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long scenario runs (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]  # if/else blocks are often clearer than ternaries

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
